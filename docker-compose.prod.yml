version: '3.9'

services:
  # قاعدة البيانات
  db:
    image: postgres:15-alpine
    container_name: mzayn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mzayn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MzaYn@2025!}
      POSTGRES_DB: mzayn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mzayn -d mzayn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis طابور المهام
  redis:
    image: redis:7-alpine
    container_name: mzayn_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mzayn_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mzayn:${DB_PASSWORD:-Mzayn2025SecretPass}@db:5432/mzayn_db
      UPLOAD_DIR: /app/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75

  # Frontend React Static Build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mzayn_frontend
    restart: unless-stopped

  # Discord Bot بوت مزاين التفاعلي
  discord_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mzayn_discord_bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mzayn:${DB_PASSWORD:-Mzayn2025SecretPass}@db:5432/mzayn_db
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-MTU0NDQwMTYzNzQ0NjI1ODg5OA.GLcIZ_.x8bn_AYSLanjT2m_QGCQKUU-F6nO81K1FzR1Aw}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: python bot.py

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mzayn_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  redis_data:
